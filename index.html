<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Canhotos Logísticos</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>
  <style>
    #splash-screen {
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
    }
    #splash-screen.hidden-splash {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white">

  <!-- ================= TELA DE ABERTURA ================= -->
  <div id="splash-screen" class="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center p-4">
    <div class="animate-pulse flex flex-col items-center">
      <img src="logo.png" alt="Logotipo" class="h-40 md:h-56 w-auto object-contain mb-6 drop-shadow-2xl" onerror="this.src='https://via.placeholder.com/300x120/111827/FFFFFF?text=Seu+Logo+Aqui'">
      <div class="flex items-center space-x-3 text-brand-500 font-semibold">
        <i class="fa-solid fa-circle-notch animate-spin text-xl"></i>
        <span class="tracking-widest uppercase text-sm">Carregando Sistema...</span>
      </div>
    </div>
  </div>

  <!-- ================= CABEÇALHO ================= -->
  <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-24 flex items-center justify-between">
      <div class="flex-1 flex justify-center md:justify-start items-center">
        <img src="logo.png" alt="Logotipo" class="h-16 md:h-20 w-auto object-contain py-1" onerror="this.src='https://via.placeholder.com/200x60/111827/FFFFFF?text=Logo'">
      </div>
      <div class="hidden sm:flex items-center space-x-2 text-xs bg-zinc-800 border border-zinc-700 px-3 py-1.5 rounded-full text-zinc-300">
        <span class="h-2.5 w-2.5 rounded-full bg-brand-500 animate-pulse"></span>
        <span>Google Drive Conectado</span>
      </div>
    </div>
  </header>

  <!-- ================= CONTEÚDO PRINCIPAL ================= -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col">
    
    <!-- MENU DE ABAS -->
    <div class="flex border-b border-zinc-800 mb-8 space-x-4">
      <button id="tab-btn-add" onclick="switchTab('add')" class="pb-3 px-4 text-base font-medium flex items-center space-x-2 border-b-2 border-brand-500 text-brand-500 transition-colors">
        <i class="fa-solid fa-plus-circle"></i>
        <span>Adicionar Canhoto</span>
      </button>
      <button id="tab-btn-search" onclick="switchTab('search')" class="pb-3 px-4 text-base font-medium flex items-center space-x-2 border-b-2 border-transparent text-zinc-400 hover:text-zinc-200 transition-colors">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>Buscar Canhoto</span>
      </button>
    </div>

    <!-- ================= ADICIONAR CANHOTO ================= -->
    <section id="section-add" class="space-y-6 max-w-2xl mx-auto w-full">
      <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 shadow-xl">
        <h2 class="text-xl font-bold mb-6 flex items-center space-x-2 text-white">
          <i class="fa-solid fa-file-invoice text-brand-500"></i>
          <span>Novo Registro de Canhoto</span>
        </h2>

        <form id="form-canhoto" onsubmit="salvarCanhoto(event)" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-zinc-300 mb-1">Data de Emissão / Recebimento</label>
            <input type="date" id="dataInput" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-brand-500 outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-zinc-300 mb-1">Placa do Veículo / Motorista</label>
            <input type="text" id="placaInput" placeholder="Ex: ABC1D23" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-brand-500 outline-none uppercase">
          </div>

          <div>
            <label class="block text-sm font-medium text-zinc-300 mb-1">Número da Nota Fiscal (NF)</label>
            <input type="text" id="nfInput" placeholder="Ex: 004521" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-brand-500 outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-zinc-300 mb-1">Imagem do Canhoto</label>
            <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-zinc-700 border-dashed rounded-lg hover:border-brand-500 transition-colors bg-zinc-950/50">
              <div class="space-y-2 text-center">
                <i class="fa-solid fa-cloud-arrow-up text-4xl text-zinc-500"></i>
                <div class="flex text-sm text-zinc-400 justify-center">
                  <label for="fileInput" class="relative cursor-pointer bg-zinc-800 rounded-md font-medium text-brand-500 hover:text-brand-400 px-3 py-1">
                    <span>Selecionar arquivo</span>
                    <input id="fileInput" type="file" accept="image/*" required class="sr-only" onchange="previewImage(event)">
                  </label>
                </div>
                <p class="text-xs text-zinc-500">PNG, JPG ou WEBP</p>
              </div>
            </div>
          </div>

          <div id="image-preview-container" class="hidden relative rounded-lg overflow-hidden border border-zinc-700 bg-zinc-950 max-h-64 flex items-center justify-center">
            <img id="image-preview" src="#" alt="Pré-visualização" class="max-h-64 object-contain">
            <button type="button" onclick="clearImage()" class="absolute top-2 right-2 bg-red-600/80 hover:bg-red-600 text-white p-2 rounded-full text-xs">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>

          <div class="flex space-x-4 pt-4">
            <button type="submit" id="btn-save" class="flex-1 bg-brand-600 hover:bg-brand-500 text-white font-medium py-3 px-4 rounded-lg flex items-center justify-center space-x-2 transition-colors">
              <i class="fa-solid fa-cloud-arrow-up"></i>
              <span id="btn-save-text">Salvar no Drive & Planilha</span>
            </button>
            <button type="button" onclick="resetForm()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium py-3 px-4 rounded-lg flex items-center justify-center space-x-2 transition-colors">
              <i class="fa-solid fa-eraser"></i>
              <span>Limpar</span>
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- ================= BUSCAR CANHOTO ================= -->
    <section id="section-search" class="hidden space-y-6">
      <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 shadow-xl">
        <h2 class="text-xl font-bold mb-6 flex items-center space-x-2 text-white">
          <i class="fa-solid fa-filter text-brand-500"></i>
          <span>Consultar Canhotos</span>
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-zinc-400 mb-1">Filtrar por Data</label>
            <input type="date" id="searchData" oninput="buscarCanhotos()" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2 text-white outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-zinc-400 mb
